<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東京JP助手 V3.8 - 匯率自定義版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fbff; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .fuji-blue { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .nav-active { color: #1e40af; font-weight: bold; }
        .page { display: none; }
        .page.active { display: block; }
        .day-btn.active { background-color: #1e40af; color: white; border-color: #1e40af; transform: scale(1.05); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .interval-tag { position: relative; left: 15px; border-left: 2px dashed #d1d5db; margin: -2px 0; padding: 10px 0 10px 25px; font-size: 10px; color: #9ca3af; }
        .checked-item { text-decoration: line-through; opacity: 0.5; }
    </style>
</head>
<body class="pb-24">

    <div class="fuji-blue text-white p-5 rounded-b-[30px] shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black italic uppercase">Tokyo Trip</h1>
            <div class="flex gap-2">
                <button onclick="exportData()" class="text-[10px] bg-white/20 px-3 py-1 rounded-full">導出</button>
                <button onclick="importData()" class="text-[10px] bg-white/20 px-3 py-1 rounded-full">匯入</button>
            </div>
        </div>
    </div>

    <div id="page-itinerary" class="page active p-4 space-y-4">
        <div id="flightArea" class="bg-white rounded-3xl shadow-sm border border-blue-50 overflow-hidden">
            <div class="flex border-b border-gray-100">
                <button onclick="toggleFlight('go')" id="goBtn" class="flex-1 py-3 text-xs font-bold bg-blue-50 text-blue-600">去程 4/8</button>
                <button onclick="toggleFlight('back')" id="backBtn" class="flex-1 py-3 text-xs font-bold text-gray-400">回程 4/13</button>
            </div>
            <div id="flightCard" class="p-5"></div>
        </div>
        <div class="flex space-x-2 overflow-x-auto py-2 hide-scroll" id="dayBar"></div>
        <div id="tripList" class="space-y-0 pb-4"></div>
    </div>

    <div id="page-tools" class="page p-4 space-y-6">
        <section id="weatherArea"></section>
        
        <section class="bg-blue-900 text-white p-6 rounded-[2rem] shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xs font-bold tracking-widest"><i class="fa-solid fa-calculator mr-2 text-yellow-400"></i> 自定義匯率轉換</h2>
                <div class="bg-white/10 px-3 py-2 rounded-xl flex items-center gap-2 border border-white/10">
                    <span class="text-[10px] text-blue-200">當前匯率:</span>
                    <input type="number" id="customRate" value="0.211" step="0.001" oninput="conv('j')" class="bg-transparent text-sm w-16 font-black outline-none text-yellow-300">
                </div>
            </div>
            <div class="space-y-4">
                <div class="relative">
                    <label class="absolute -top-2 left-4 bg-blue-900 px-2 text-[9px] text-blue-300 uppercase">JPY 日幣</label>
                    <input type="number" id="jpyV" oninput="conv('j')" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-2xl font-bold outline-none focus:border-blue-400 transition-all" placeholder="0">
                </div>
                <div class="flex justify-center"><i class="fa-solid fa-repeat text-blue-400"></i></div>
                <div class="relative">
                    <label class="absolute -top-2 left-4 bg-blue-900 px-2 text-[9px] text-blue-300 uppercase">TWD 台幣</label>
                    <input type="number" id="twdV" oninput="conv('t')" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-2xl font-bold outline-none focus:border-blue-400 transition-all" placeholder="0">
                </div>
            </div>
            <p class="text-[9px] text-blue-400 mt-4 text-center italic">※ 請先在右上角輸入您購買的即時匯率</p>
        </section>
    </div>

    <div id="page-prep" class="page p-4">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-50">
            <div class="flex bg-gray-50 rounded-2xl p-1 mb-5">
                <button onclick="toggleWish('place')" id="wishPlaceBtn" class="flex-1 py-3 text-[11px] font-bold rounded-xl bg-white shadow-sm text-blue-600 transition-all">想去的地點</button>
                <button onclick="toggleWish('buy')" id="wishBuyBtn" class="flex-1 py-3 text-[11px] font-bold text-gray-400 transition-all">想買的清單</button>
            </div>
            <div class="flex gap-2 mb-6">
                <input type="text" id="wishIn" class="flex-1 bg-gray-50 p-4 rounded-2xl text-xs outline-none border-none focus:ring-2 focus:ring-blue-100" placeholder="點擊新增項目...">
                <button onclick="addWish()" class="bg-blue-600 text-white px-6 rounded-2xl text-xs font-bold">新增</button>
            </div>
            <ul id="wishList" class="space-y-3"></ul>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-100 flex justify-around p-4 z-50">
        <button onclick="switchPage('itinerary')" id="nav-itinerary" class="flex flex-col items-center nav-active"><i class="fa-solid fa-route text-lg"></i><span class="text-[9px] mt-1">行程</span></button>
        <button onclick="switchPage('tools')" id="nav-tools" class="flex flex-col items-center text-gray-300"><i class="fa-solid fa-wand-magic-sparkles text-lg"></i><span class="text-[9px] mt-1">工具</span></button>
        <button onclick="switchPage('prep')" id="nav-prep" class="flex flex-col items-center text-gray-300"><i class="fa-solid fa-heart text-lg"></i><span class="text-[9px] mt-1">願望</span></button>
    </nav>

    <script>
        let currentDay = 1;
        let currentWishType = 'place';
        const flightData = {
            go: { f: 'TPE', t: 'NRT', timeF: '13:10', timeT: '17:35', code: 'GK 14', dur: '3h 25m' },
            back: { f: 'NRT', t: 'TPE', timeF: '22:40', timeT: '01:30', code: 'GK 11', dur: '3h 50m' }
        };

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('nav-active', 'text-gray-300'));
            document.getElementById('nav-'+p).classList.add('nav-active');
        }

        function toggleFlight(t) {
            const f = flightData[t];
            document.getElementById('goBtn').className = `flex-1 py-3 text-xs font-bold ${t==='go'?'bg-blue-50 text-blue-600':'text-gray-400'}`;
            document.getElementById('backBtn').className = `flex-1 py-3 text-xs font-bold ${t==='back'?'bg-blue-50 text-blue-600':'text-gray-400'}`;
            document.getElementById('flightCard').innerHTML = `<div class="flex justify-between items-center text-center"><div><p class="text-2xl font-black text-blue-900">${f.f}</p><p class="text-[11px] font-bold mt-1 text-blue-600">${f.timeF}</p></div><div class="flex-1 px-4 flex flex-col items-center"><p class="text-[8px] text-gray-300 font-bold mb-1 italic">${f.dur}</p><div class="flex items-center w-full"><div class="border-t border-gray-100 flex-1"></div><i class="fa-solid fa-plane text-blue-500 mx-2 text-xs"></i><div class="border-t border-gray-100 flex-1"></div></div><p class="text-[9px] text-blue-400 font-black mt-1 uppercase">${f.code}</p></div><div><p class="text-2xl font-black text-blue-900">${f.t}</p><p class="text-[11px] font-bold mt-1 text-blue-600">${f.timeT}</p></div></div>`;
        }

        function renderDayBar() {
            const days = [{d:'4/8',n:'D1'},{d:'4/9',n:'D2'},{d:'4/10',n:'D3'},{d:'4/11',n:'D4'},{d:'4/12',n:'D5'},{d:'4/13',n:'D6'}];
            document.getElementById('dayBar').innerHTML = days.map((day, i) => `<button onclick="switchDay(${i+1})" id="day-btn-${i+1}" class="day-btn flex-shrink-0 w-14 h-14 rounded-2xl border-2 border-gray-100 bg-white text-center flex flex-col justify-center transition-all ${i===0?'active':''}">
                <span class="text-[9px] font-bold">${day.n}</span><span class="text-[11px]">${day.d}</span>
            </button>`).join('');
        }

        function switchDay(d) {
            currentDay = d;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('day-btn-'+d).classList.add('active');
            renderTrips();
        }

        function renderTrips() {
            const trips = JSON.parse(localStorage.getItem('tokyo_v35_trips') || '{}')[currentDay] || [];
            const list = document.getElementById('tripList');
            let html = '';
            trips.forEach((t, i) => {
                const mapHref = t.map || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.name)}`;
                html += `
                    <div class="bg-white p-5 rounded-[1.8rem] shadow-sm border border-gray-50 flex items-center gap-5 mb-1">
                        <div class="text-blue-600 font-black text-[13px] min-w-[40px]">${t.time}</div>
                        <div class="flex-1 border-l pl-5 border-gray-100">
                            <h4 class="font-black text-sm text-gray-800 line-clamp-1">${t.name}</h4>
                            <p class="text-[10px] text-blue-400 mt-1 line-clamp-1">${t.note || '備註...'}</p>
                        </div>
                        <a href="${mapHref}" target="_blank" class="w-10 h-10 rounded-full ${t.map ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-500'} flex items-center justify-center text-sm shadow-sm"><i class="fa-solid fa-location-arrow"></i></a>
                    </div>`;
            });
            list.innerHTML = html || `<div class="text-center py-20 text-gray-300 text-[10px] font-bold uppercase">No Plans</div>`;
        }

        // 匯率自定義邏輯
        function conv(type) {
            const rate = parseFloat(document.getElementById('customRate').value) || 0.211;
            const jpy = document.getElementById('jpyV'), twd = document.getElementById('twdV');
            if(type === 'j') twd.value = (jpy.value * rate).toFixed(0);
            else jpy.value = (twd.value / rate).toFixed(0);
        }

        // 願望邏輯
        function toggleWish(type) {
            currentWishType = type;
            document.getElementById('wishPlaceBtn').className = `flex-1 py-3 text-[11px] font-bold rounded-xl ${type==='place'?'bg-white shadow-sm text-blue-600':'text-gray-400'}`;
            document.getElementById('wishBuyBtn').className = `flex-1 py-3 text-[11px] font-bold rounded-xl ${type==='buy'?'bg-white shadow-sm text-blue-600':'text-gray-400'}`;
            renderWishes();
        }
        function addWish() {
            const val = document.getElementById('wishIn').value; if(!val) return;
            let data = JSON.parse(localStorage.getItem('tokyo_v35_wish') || '{"place":[], "buy":[]}');
            if(!data[currentWishType]) data[currentWishType] = [];
            data[currentWishType].push({t: val, d: false});
            localStorage.setItem('tokyo_v35_wish', JSON.stringify(data));
            document.getElementById('wishIn').value = ""; renderWishes();
        }
        function renderWishes() {
            const allData = JSON.parse(localStorage.getItem('tokyo_v35_wish') || '{"place":[], "buy":[]}');
            const data = allData[currentWishType] || [];
            document.getElementById('wishList').innerHTML = data.map((w, i) => `
                <li class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl ${w.d?'checked-item':''}">
                    <span onclick="toggleItem(${i})" class="text-xs font-bold text-gray-700">${w.t}</span>
                    <button onclick="delItem(${i})" class="text-gray-300"><i class="fa-solid fa-xmark"></i></button>
                </li>`).join('');
        }
        function toggleItem(i) {
            let data = JSON.parse(localStorage.getItem('tokyo_v35_wish'));
            data[currentWishType][i].d = !data[currentWishType][i].d;
            localStorage.setItem('tokyo_v35_wish', JSON.stringify(data)); renderWishes();
        }
        function delItem(i) {
            let data = JSON.parse(localStorage.getItem('tokyo_v35_wish'));
            data[currentWishType].splice(i, 1);
            localStorage.setItem('tokyo_v35_wish', JSON.stringify(data)); renderWishes();
        }

        function exportData() { const d = { trips: localStorage.getItem('tokyo_v35_trips'), wishes: localStorage.getItem('tokyo_v35_wish') }; prompt("備份代碼：", btoa(unescape(encodeURIComponent(JSON.stringify(d))))); }
        function importData() { const c = prompt("貼上備份代碼："); if(!c) return; const d = JSON.parse(decodeURIComponent(escape(atob(c)))); localStorage.setItem('tokyo_v35_trips', d.trips); localStorage.setItem('tokyo_v35_wish', d.wishes); location.reload(); }

        window.onload = () => {
            renderDayBar(); toggleFlight('go'); renderTrips(); toggleWish('place');
            const weather = [
                {d:'4/8',i:'fa-sun',t:'18° / 12°'}, {d:'4/9',i:'fa-cloud',t:'16° / 11°'},
                {d:'4/10',i:'fa-cloud-rain',t:'14° / 10°'}, {d:'4/11',i:'fa-sun',t:'20° / 13°'},
                {d:'4/12',i:'fa-sun',t:'22° / 15°'}, {d:'4/13',i:'fa-cloud-sun',t:'19° / 14°'}
            ];
            document.getElementById('weatherArea').innerHTML = `
                <h2 class="text-gray-700 font-bold mb-4 text-sm px-1">東京預計氣溫</h2>
                <div class="flex space-x-3 overflow-x-auto pb-4 hide-scroll">
                    ${weather.map(w=>`<div class="bg-white p-5 rounded-[2rem] min-w-[110px] text-center border border-gray-50 shadow-sm">
                        <p class="text-[10px] text-gray-400 font-black mb-2">${w.d}</p>
                        <i class="fa-solid ${w.i} text-blue-500 text-2xl my-3"></i>
                        <p class="text-[11px] font-bold text-gray-700">${w.t}</p>
                    </div>`).join('')}
                </div>`;
        };
    </script>
</body>
</html>
